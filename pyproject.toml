[project]
name = "kronos-market-desk"
version = "0.1.0"
description = "Local, read-only market observation dashboard with probabilistic forecasts from the Kronos foundation model. Not a trading system."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "ccxt>=4.3",
    "yfinance>=0.2.40",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "torch>=2.0.0",
    "huggingface_hub==0.33.1",
    "pandas==2.2.2",
    "numpy",
    "safetensors==0.6.2",
    "einops==0.8.1",
    "tqdm==4.67.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored upstream Kronos source, not owned/authored by this project — see
# NOTES/kronos_api.md and DECISIONS.md #1. `mypy`'s `files` setting already
# scopes to `src/kmd`; `ruff` needs the same exclusion since it otherwise
# lints the whole repo by default.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/kmd"]

[[tool.mypy.overrides]]
module = ["model.*", "ccxt.*", "yfinance.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `network` marker's own docstring below promises exclusion from the
# default run; `-m "not network"` is what actually makes that true (a
# registered marker alone doesn't skip anything). Run `pytest -m network`
# explicitly to opt into the one real-model integration test that needs it.
addopts = "-ra -m \"not network\""
markers = [
    "network: requires network access (excluded from default CI run)",
]
